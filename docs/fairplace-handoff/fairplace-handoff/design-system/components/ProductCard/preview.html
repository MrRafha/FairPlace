<!-- @dsCard group="Cartões" height=320 subtitle="Produto no perfil público do vendedor" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap">
</head>
<body style="margin:0">
<div class="fp-stage">
  <article class="fp-card fp-card--link fp-product" tabindex="0">
    <div class="fp-product__img">
      <svg class="fp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"/><path d="M4 10a2.67 2.67 0 005.33 0 2.67 2.67 0 005.34 0A2.67 2.67 0 0020 10"/><path d="M6 13v6h12v-6"/></svg>
    </div>
    <div class="fp-product__body">
      <h3 class="fp-product__name">Queijo coalho</h3>
      <span class="fp-caption">Feito na semana, peça de 500 g</span>
      <span class="fp-product__price">R$ 22,00</span>
    </div>
  </article>
  <article class="fp-card fp-card--link fp-product" tabindex="0">
    <div class="fp-product__img">
      <svg class="fp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"/><path d="M4 10a2.67 2.67 0 005.33 0 2.67 2.67 0 005.34 0A2.67 2.67 0 0020 10"/><path d="M6 13v6h12v-6"/></svg>
    </div>
    <div class="fp-product__body">
      <h3 class="fp-product__name">Doce de buriti</h3>
      <span class="fp-caption">Pote de 300 g</span>
      <span class="fp-product__price">R$ 15,00</span>
    </div>
  </article>
  <article class="fp-card fp-product fp-product--off">
    <div class="fp-product__img">
      <svg class="fp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"/><path d="M4 10a2.67 2.67 0 005.33 0 2.67 2.67 0 005.34 0A2.67 2.67 0 0020 10"/><path d="M6 13v6h12v-6"/></svg>
    </div>
    <div class="fp-product__body">
      <h3 class="fp-product__name">Farinha de puba</h3>
      <span class="fp-caption">O quilo</span>
      <span class="fp-product__price">R$ 9,00</span>
      <span class="fp-badge fp-badge--off" style="align-self:flex-start">Indisponível</span>
    </div>
  </article>
</div>
</body>
</html>

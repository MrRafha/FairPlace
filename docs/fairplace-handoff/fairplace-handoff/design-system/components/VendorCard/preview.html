<!-- @dsCard group="Cartões" height=250 subtitle="Item da lista de vendedores do mapa" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap">
</head>
<body style="margin:0">
<div class="fp-stage">
  <div class="fp-col">
    <a class="fp-card fp-card--link fp-vendor" href="#" aria-current="true">
      <span class="fp-iconbox">
        <svg class="fp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"/><path d="M4 10a2.67 2.67 0 005.33 0 2.67 2.67 0 005.34 0A2.67 2.67 0 0020 10"/><path d="M6 13v6h12v-6"/></svg>
      </span>
      <span class="fp-vendor__body">
        <span class="fp-vendor__top">
          <h3 class="fp-vendor__name">Banca da Dona Lúcia</h3>
          <span class="fp-badge fp-badge--verified">
            <svg class="fp-ico fp-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            Verificado
          </span>
        </span>
        <span class="fp-caption">Feira e alimentos · 350 m</span>
        <span class="fp-caption">Rua do Mercado, Centro</span>
      </span>
    </a>
    <a class="fp-card fp-card--link fp-vendor" href="#">
      <span class="fp-iconbox fp-iconbox--artesanato">
        <svg class="fp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 9-7 9-7-9z"/><path d="M5 12h14"/></svg>
      </span>
      <span class="fp-vendor__body">
        <span class="fp-vendor__top">
          <h3 class="fp-vendor__name">Ateliê Barro Vivo</h3>
        </span>
        <span class="fp-caption">Artesanato · 1,2 km</span>
        <span class="fp-caption">Travessa das Olarias, Vermelhão</span>
      </span>
    </a>
  </div>
  <div class="fp-col">
    <a class="fp-card fp-card--link fp-vendor" href="#">
      <span class="fp-iconbox fp-iconbox--agricultura">
        <svg class="fp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 15c0-3-2-5-7-5 0 4 3 6 7 5z"/></svg>
      </span>
      <span class="fp-vendor__body">
        <span class="fp-vendor__top">
          <h3 class="fp-vendor__name">Sítio Boa Esperança</h3>
          <span class="fp-badge fp-badge--verified">
            <svg class="fp-ico fp-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            Verificado
          </span>
        </span>
        <span class="fp-caption">Agricultura local · 4,8 km</span>
        <span class="fp-caption">Estrada do Caxingó, zona rural</span>
      </span>
    </a>
    <div class="fp-card fp-vendor" aria-hidden="true">
      <span class="fp-skel" style="width:40px;height:40px"></span>
      <span class="fp-vendor__body">
        <span class="fp-skel" style="width:70%;height:16px"></span>
        <span class="fp-skel" style="width:45%;height:12px"></span>
        <span class="fp-skel" style="width:60%;height:12px"></span>
      </span>
    </div>
  </div>
</div>
</body>
</html>

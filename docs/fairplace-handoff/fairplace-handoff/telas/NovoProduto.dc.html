<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo produto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-labelledby="np-title" style="width: 520px; height: 700px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 18px; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #1f2933; background: #ffffff">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 id="np-title" style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.25; letter-spacing: -0.5px">Novo produto</h1>
<span style="color: #66736b">Leva menos de um minuto e já aparece na sua vitrine.</span>
</div>
<a href="Painel.dc.html" aria-label="Fechar" style="display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 1px solid #dfe5df; border-radius: 8px; color: #1f2933"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 132px; border: 1px dashed #7f8b83; border-radius: 12px; background: #f8f6f0; color: #1f2933; font-family: inherit; font-size: 14px; cursor: pointer">
<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" style="fill: none; stroke: #205936; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M4 17l5-4 4 3 3-2 4 3"></path></svg>
<span style="font-weight: 700">Adicionar foto</span>
<span style="font-size: 12px; font-weight: 500; color: #66736b">Opcional. Uma foto clara vende mais.</span>
</button>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="np-nome" style="font-weight: 600; font-size: 13px">Nome do produto</label><input id="np-nome" placeholder="Ex.: Queijo coalho" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border: 1px solid #7f8b83; border-radius: 8px; background: #ffffff; color: #1f2933; font-family: inherit; font-size: 14px"></div>

<div style="display: flex; gap: 16px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><label for="np-preco" style="font-weight: 600; font-size: 13px">Preço (R$)</label><input id="np-preco" inputmode="decimal" placeholder="0,00" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border: 1px solid #7f8b83; border-radius: 8px; background: #ffffff; color: #1f2933; font-family: inherit; font-size: 14px"></div>
<div style="flex: 1.4; display: flex; flex-direction: column; gap: 6px"><label for="np-cat" style="font-weight: 600; font-size: 13px">Categoria</label><select id="np-cat" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border: 1px solid #7f8b83; border-radius: 8px; background: #ffffff; color: #1f2933; font-family: inherit; font-size: 14px"><option>Feira e alimentos</option><option>Artesanato</option><option>Agricultura local</option></select></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="np-desc" style="font-weight: 600; font-size: 13px">Descrição</label><input id="np-desc" placeholder="Unidade, peso ou um detalhe que ajuda a escolher" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px; border: 1px solid #7f8b83; border-radius: 8px; background: #ffffff; color: #1f2933; font-family: inherit; font-size: 14px"></div>

<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; font-size: 13px"><input type="checkbox" defaultChecked="{{ true }}" style="width: 20px; height: 20px; margin: 0; accent-color: #2f7d4a">Disponível hoje</label>

<div style="margin-top: auto; display: flex; gap: 10px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid #dfe5df">
<a href="Painel.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 1px solid #dfe5df; border-radius: 8px; background: #ffffff; color: #1f2933; font-weight: 700; text-decoration: none">Cancelar</a>
<a href="Painel.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 8px; background: #2f7d4a; color: #ffffff; font-weight: 700; text-decoration: none; box-shadow: 0 6px 16px rgba(47,125,74,0.28)">Adicionar produto</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
